name: Mise à jour et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # chaque jour à 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer sondages (Wikipédia) + marché (Polymarket)
        continue-on-error: true   # source externe en panne : on garde le dernier raw committé
        run: python scripts/update539.py fetch

      - name: Construire data.js
        run: python scripts/update539.py build

      - name: Committer les nouvelles données
        continue-on-error: true   # un échec d'envoi ne doit JAMAIS empêcher le déploiement
        run: |
          if [ -z "$(git status --porcelain raw site/data.js)" ]; then echo "Aucune nouvelle donnée."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw site/data.js
          git commit -m "Données 539 mises à jour ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Envoi refusé, nouvel essai ($i)…"; sleep $((i * 5))
          done
          echo "::warning::Données non poussées après 3 essais (le site est tout de même déployé)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
